# Configuration for Stock Forecasting Project
# All hyperparameters and settings in one place

# ==============================================================================
# DATA CONFIGURATION (Phase 1: Data Preparation)
# ==============================================================================
data:
  # Stock data parameters
  tickers: ['AAPL', 'MSFT', 'GOOGL', 'AMZN', 'TSLA', 'META', 'NVDA']  # Example tickers
  download_source: 'yfinance'  # 'yfinance', 'quandl', 'csv'
  start_date: '2018-01-01'
  end_date: '2025-12-31'
  frequency: 'D'  # Daily
  
  # Target Variable Engineering
  target_col: 'Adj Close'  # Column to shift for creating forward returns
  lookback_window: 60  # days of historical data to use as input
  forecast_horizons: [7, 30]  # Create target_7d and target_30d columns
  
  # Temporal Train/Val/Test Split (CRITICAL: No Data Leakage)
  train_end_date: '2023-12-31'      # Training: 2018-01-01 to 2023-12-31 (~70%)
  val_start_date: '2024-01-30'      # Validation: After gap buffer (30 days after train_end)
  val_end_date: '2024-09-30'        # Validation ends Q3 2024 (~15%)
  test_start_date: '2024-10-30'     # Test: After gap buffer (30 days after val_end)
  test_end_date: '2025-12-31'       # Test ends: ~15%
  gap_buffer_days: 30               # Buffer between splits to prevent look-ahead
                                    # (ensures 30-day target at end of train doesn't leak to val)
  
  # Features to include in model training
  features:
    - 'log_returns'
    - 'rolling_mean_5'
    - 'rolling_mean_20'
    - 'rolling_mean_50'
    - 'rolling_vol_20'
    - 'rsi_14'
    - 'volume_sma_ratio'
  
  # Survivorship Bias Removal (Phase 1 Critical)
  survivorship:
    min_required_days_pct: 0.95     # Stock must have 95% of trading days in period
    remove_incomplete: true          # Remove tickers with gaps > 5%
    min_data_points: 252             # Minimum trading days required per ticker
  
  # Transaction Costs (Applied during return calculations)
  costs:
    bid_ask_spread: 0.001            # ±0.1% (half on entry, half on exit)
    slippage: 0.0005                 # ±0.05% per trade execution
    commission_pct: 0.0005           # 0.05% per transaction
  
  # Data Cleaning & Quality
  handle_missing: 'forward_fill'  # 'forward_fill', 'backward_fill', 'drop'
  outlier_method: 'iqr'            # 'iqr' or 'zscore'
  outlier_threshold: 3.0           # IQR multiplier or z-score threshold

# ==============================================================================
# PREPROCESSING
# ==============================================================================
preprocessing:
  scaling_method: 'standard'  # 'standard', 'minmax', 'robust'
  fit_on_train_only: true
  remove_outliers: true
  normalize_returns: true

# ==============================================================================
# CLASSICAL MODELS
# ==============================================================================
classical_models:
  
  arima:
    enabled: true
    auto_search: true
    pdq_range: [2, 2, 2]  # Max values for p, d, q
    seasonal: false
    
  sarima:
    enabled: true
    auto_search: true
    pdq_range: [2, 2, 2]  # Max values for p, d, q
    seasonal: true
    seasonal_period: 252  # Trading days per year, or 5 for weekly
    PDQ_range: [1, 1, 1]  # Max S, D, Q
    
  prophet:
    enabled: true
    interval_width: 0.95
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
    seasonality_mode: 'additive'  # 'additive' or 'multiplicative'
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
    holidays:
      include_us_holidays: true
      custom_holidays: []

# ==============================================================================
# DEEP LEARNING - LSTM
# ==============================================================================
lstm:
  enabled: true
  
  # Architecture - Single Step
  single_step:
    input_shape: [60, null]  # [lookback, n_features] - filled at runtime
    architecture:
      - type: 'lstm'
        units: 64
        return_sequences: true
        dropout: 0.2
      - type: 'lstm'
        units: 32
        return_sequences: false
        dropout: 0.2
      - type: 'dense'
        units: 1
        activation: 'linear'
    
  # Architecture - Multi Step (Seq2Seq)
  multi_step:
    input_shape: [60, null]
    encoder_units: [64, 32]
    decoder_units: [32]
    decoder_steps: 30  # Max forecast horizon
    dropout: 0.2
  
  # Training
  batch_size: 32
  epochs: 100
  validation_split: 0.2
  early_stopping_patience: 15
  optimizer: 'adam'
  learning_rate: 0.001
  loss: 'mse'
  
  # Regularization
  l1_reg: 0.0
  l2_reg: 0.0001
  
  # Model selection
  use_bidirectional: false
  use_attention: false

# ==============================================================================
# DEEP LEARNING - TRANSFORMER
# ==============================================================================
transformer:
  enabled: true
  
  # Architecture
  input_dim: null  # Set at runtime (n_features)
  model_dim: 64
  num_heads: 8
  num_layers: 2
  ff_hidden_dim: 256
  max_seq_len: 512
  dropout: 0.1
  
  # Positional Encoding
  positional_encoding: 'sinusoidal'
  
  # Output
  output_type: 'single'  # 'single' for scalar, 'sequence' for multi-step
  
  # Training
  batch_size: 32
  epochs: 100
  validation_split: 0.2
  early_stopping_patience: 15
  optimizer: 'adam'
  learning_rate: 0.001
  loss: 'mse'
  
  # Regularization
  l2_reg: 0.0001
  dropout_attention: 0.1

# ==============================================================================
# EVALUATION
# ==============================================================================
evaluation:
  metrics:
    - 'mape'
    - 'rmse'
    - 'mae'
    - 'directional_accuracy'
    - 'hit_rate'  # % within ±2% of actual
  
  directional_accuracy:
    up_down: true  # Compare signs of returns
  
  statistical_tests:
    diebold_mariano: true  # Forecast comparison test
    paired_ttest: true
    confidence_level: 0.95
  
  backtesting:
    enabled: false
    position_sizing: 'equal'  # 'equal', 'volatility_weighted'
    max_drawdown_limit: 0.2

# ==============================================================================
# EXPLAINABILITY
# ==============================================================================
explainability:
  
  # Transformer attention
  plot_attention_heatmaps: true
  top_predictions_to_plot: 10
  attention_aggregation: 'mean'  # 'mean' over heads and batch
  
  # SHAP analysis
  use_shap: true
  shap_sample_size: 100  # Samples for SHAP computation
  
  # Feature importance
  permutation_importance: true
  
  # Residual analysis
  plot_residuals: true
  test_stationarity: true

# ==============================================================================
# VISUALIZATION
# ==============================================================================
visualization:
  style: 'seaborn'
  dpi: 100
  figsize: [12, 6]
  
  plots:
    actual_vs_predicted: true
    residual_distribution: true
    residual_acf: true
    qq_plot: true
    model_comparison: true
    attention_heatmaps: true
    feature_importance: true
    prophet_components: true

# ==============================================================================
# PATHS & LOGGING
# ==============================================================================
paths:
  raw_data: './data/raw/'
  processed_data: './data/processed/'
  train_test_splits: './data/splits/'
  models: './results/artifacts/'
  predictions: './results/predictions/'
  metrics: './results/metrics/'
  visualizations: './results/visualizations/'
  reports: './results/reports/'

logging:
  level: 'INFO'  # 'DEBUG', 'INFO', 'WARNING', 'ERROR'
  log_file: './logs/project.log'

# ==============================================================================
# MISC
# ==============================================================================
misc:
  random_seed: 42
  n_jobs: -1  # Parallel processing (-1 = all cores)
  verbose: 1
